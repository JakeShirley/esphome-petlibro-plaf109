name: PLAF109 UI

on:
  pull_request:
    branches:
      - main
    paths:
      - plaf109/ui/**
      - .github/workflows/plaf109-ui.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plaf109/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: plaf109/ui/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Check committed build is up to date
        run: git diff --exit-code -- build/ || (echo "::error::plaf109/ui/build is stale; run 'yarn build' in plaf109/ui and commit the result." && exit 1)
