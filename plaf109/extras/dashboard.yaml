# Replaces the stock web_server UI with the custom dashboard built from ../ui.
# Paths resolve relative to this file, so this also works as a remote package.
web_server:
  js_include: ../ui/build/app.js
  css_include: ../ui/build/style.css
  js_url: ""
  css_url: ""

text_sensor:
  - platform: version
    name: "Firmware Version"
    web_server:
      sorting_group_id: miscellaneous
